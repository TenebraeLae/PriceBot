[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pricebot"
version = "0.1.0"
description = "Telegram price-list storefront (bot + Mini App)"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.13",
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]>=2",
    "asyncpg",
    "redis>=5",
    "pydantic-settings",
    "httpx",
    "openpyxl",
    "qrcode[pil]",
    "aiohttp",
    "python-multipart",
    "aiosqlite",
    "tzdata",
    "aiolimiter",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[project.scripts]
pricebot-bot = "pricebot.bot.main:main"

[tool.hatch.build.targets.wheel]
packages = ["pricebot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
