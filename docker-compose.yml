services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pricebot
      POSTGRES_PASSWORD: pricebot
      POSTGRES_DB: pricebot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pricebot -d pricebot"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    env_file: .env
    environment:
      # service host, не localhost из .env
      DATABASE_URL: postgresql+asyncpg://pricebot:pricebot@postgres:5432/pricebot
      REDIS_URL: redis://redis:6379/0
      BOT_MODE: webhook
    ports:
      - "8080:8080"
    volumes:
      - appdata:/app/data
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  bot:
    build: .
    profiles: ["polling"]
    command: ["python", "-m", "pricebot.bot.main"]
    env_file: .env
    environment:
      # service host, не localhost из .env
      DATABASE_URL: postgresql+asyncpg://pricebot:pricebot@postgres:5432/pricebot
      REDIS_URL: redis://redis:6379/0
      BOT_MODE: polling
    volumes:
      - appdata:/app/data
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  appdata:
